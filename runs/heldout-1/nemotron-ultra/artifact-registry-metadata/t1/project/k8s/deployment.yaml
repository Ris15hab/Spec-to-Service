apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-registry-metadata
  labels:
    app: artifact-registry-metadata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: artifact-registry-metadata
  template:
    metadata:
      labels:
        app: artifact-registry-metadata
    spec:
      containers:
        - name: artifact-registry-metadata
          image: artifact-registry-metadata:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
