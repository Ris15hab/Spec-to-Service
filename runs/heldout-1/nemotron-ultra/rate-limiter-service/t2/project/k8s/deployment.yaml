apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter-service
  labels:
    app: rate-limiter-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rate-limiter-service
  template:
    metadata:
      labels:
        app: rate-limiter-service
    spec:
      containers:
        - name: rate-limiter-service
          image: rate-limiter-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
