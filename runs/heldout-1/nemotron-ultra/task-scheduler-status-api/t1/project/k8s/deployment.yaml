apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-scheduler-status-api
  labels:
    app: task-scheduler-status-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-scheduler-status-api
  template:
    metadata:
      labels:
        app: task-scheduler-status-api
    spec:
      containers:
        - name: task-scheduler-status-api
          image: task-scheduler-status-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
